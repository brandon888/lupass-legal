title: LuPass — Legal
description: Privacy policy and terms of service for the LuPass iOS app.
url: "https://brandon888.github.io"
baseurl: "/lupass-legal"

# No theme — using a custom layout in _layouts/default.html
markdown: kramdown
permalink: pretty

defaults:
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .bundle/
