<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} · {{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="icon" href="data:,">
  <style>
    :root {
      --bg: #f5efe4;
      --surface: #fbf6ec;
      --ink: #201a14;
      --muted: #6e6055;
      --accent: #b9321a;
      --line: rgba(32, 26, 20, 0.12);
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.55;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 48px 22px 64px;
    }
    nav.crumbs {
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 24px;
    }
    nav.crumbs a {
      color: var(--muted);
      text-decoration: none;
      border-bottom: 1px solid transparent;
    }
    nav.crumbs a:hover { border-bottom-color: var(--muted); }
    nav.crumbs span.sep { margin: 0 6px; }
    h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin: 0 0 6px;
    }
    h2 {
      font-size: 18px;
      font-weight: 600;
      margin: 32px 0 8px;
    }
    h3 {
      font-size: 15px;
      font-weight: 600;
      margin: 22px 0 4px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    p, ul, ol { margin: 10px 0; }
    ul, ol { padding-left: 22px; }
    li { margin: 4px 0; }
    a { color: var(--accent); }
    a:hover { text-decoration: underline; }
    code {
      background: var(--surface);
      padding: 1px 5px;
      border-radius: 3px;
      font-size: 0.92em;
    }
    em { color: var(--muted); font-style: italic; }
    hr {
      border: 0;
      border-top: 1px solid var(--line);
      margin: 32px 0;
    }
    footer {
      margin-top: 48px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      font-size: 13px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    {% if page.url != "/" %}
    <nav class="crumbs">
      <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <span class="sep">/</span>
      <span>{{ page.title }}</span>
    </nav>
    {% endif %}
    {{ content }}
    <footer>
      © {{ "now" | date: "%Y" }} LuPass · <a href="{{ '/privacy/' | relative_url }}">Privacy</a> · <a href="{{ '/terms/' | relative_url }}">Terms</a> · <a href="https://tally.so/r/2EO6QA">Support</a>
    </footer>
  </main>
</body>
</html>
